name: Desktop Build

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install tauri-cli
      - run: cd src-tauri && cargo tauri build --target ${{ matrix.target }} --bundles app,dmg,updater
      - name: Rename arch-specific tarball
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle/macos
          ls -la
          shopt -s nullglob
          for f in *.app.tar.gz; do
            [[ "$f" == *"${{ matrix.target }}"* ]] || mv "$f" "${f%.app.tar.gz}_${{ matrix.target }}.app.tar.gz"
          done
          for f in *.app.tar.gz.sig; do
            [[ "$f" == *"${{ matrix.target }}"* ]] || mv "$f" "${f%.app.tar.gz.sig}_${{ matrix.target }}.app.tar.gz.sig"
          done
          ls -la
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install tauri-cli
      - run: cd src-tauri && cargo tauri build
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: cargo install tauri-cli
      - run: cd src-tauri && cargo tauri build
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig

  publish-updater:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate latest.json for auto-updater
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}"
          NOTES=$(echo "${{ github.event.release.body }}" | jq -Rs .)

          cat > latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": ${NOTES},
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${RELEASE_URL}/AgentChannel_aarch64-apple-darwin.app.tar.gz",
                "signature": ""
              },
              "darwin-x86_64": {
                "url": "${RELEASE_URL}/AgentChannel_x86_64-apple-darwin.app.tar.gz",
                "signature": ""
              },
              "windows-x86_64": {
                "url": "${RELEASE_URL}/AgentChannel_${VERSION}_x64-setup.exe",
                "signature": ""
              },
              "linux-x86_64": {
                "url": "${RELEASE_URL}/AgentChannel_${VERSION}_amd64.AppImage",
                "signature": ""
              }
            }
          }
          ENDJSON
          # Strip leading whitespace from heredoc
          python3 -c "import json; d=json.load(open('latest.json')); json.dump(d, open('latest.json','w'), indent=2)"
      - name: Read signatures and update latest.json
        run: |
          # Download sig files from release and inject into latest.json
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}"
          for asset in $(gh release view ${{ github.event.release.tag_name }} --json assets -q '.assets[].name' | grep '\.sig$'); do
            SIG=$(curl -sL "${RELEASE_URL}/${asset}")
            if echo "$asset" | grep -q "aarch64-apple-darwin\.app\.tar\.gz\.sig"; then
              jq --arg sig "$SIG" '.platforms["darwin-aarch64"].signature = $sig' latest.json > tmp.json && mv tmp.json latest.json
            elif echo "$asset" | grep -q "x86_64-apple-darwin\.app\.tar\.gz\.sig"; then
              jq --arg sig "$SIG" '.platforms["darwin-x86_64"].signature = $sig' latest.json > tmp.json && mv tmp.json latest.json
            elif echo "$asset" | grep -q "setup\.exe\.sig"; then
              jq --arg sig "$SIG" '.platforms["windows-x86_64"].signature = $sig' latest.json > tmp.json && mv tmp.json latest.json
            elif echo "$asset" | grep -q "AppImage\.sig"; then
              jq --arg sig "$SIG" '.platforms["linux-x86_64"].signature = $sig' latest.json > tmp.json && mv tmp.json latest.json
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
